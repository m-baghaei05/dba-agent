# DBA Agent configuration.
# Switch provider/model by changing `active_profile` (or set DBA_PROFILE in .env).
# No code changes are needed: every profile uses the OpenAI-compatible chat API.
# Run `dba models` to list the model IDs a provider offers.

active_profile: avalai

profiles:
  avalai:
    base_url: "https://api.avalai.ir/v1"        # verify in your AvalAI dashboard
    model: "dba-agent"                           # pick an open model, e.g. a DeepSeek/Qwen/GLM ID
    api_key_env: AVALAI_API_KEY

  gapgpt:
    base_url: "https://api.gapgpt.app/v1"       # verify in your GapGPT dashboard
    model: "CHANGE-ME"
    api_key_env: GAPGPT_API_KEY

  kilo_free:
    base_url: "https://api.kilo.ai/api/gateway"
    model: "CHANGE-ME"                           # one of the free model IDs from `dba models`
    api_key_env: KILO_API_KEY

  openrouter_free:
    base_url: "https://openrouter.ai/api/v1"
    model: "openrouter/free"                     # router across currently free models
    api_key_env: OPENROUTER_API_KEY

  deepseek:
    base_url: "https://api.deepseek.com"
    model: "deepseek-v4-flash"
    api_key_env: DEEPSEEK_API_KEY
    json_mode: true

  ollama:
    base_url: "http://localhost:11434/v1"       # local models, no API key needed
    model: "CHANGE-ME"
    api_key_env: null

llm:
  temperature: 0.2          # low = more consistent, repeatable designs
  max_retries: 3            # attempts per call when output is invalid JSON / fails validation
  timeout_seconds: 180

workflow:
  interview_min_followup_rounds: 1   # spec: at least one follow-up round
  interview_max_rounds: 4            # hard stop so the interview always ends
  sql_max_repair_attempts: 3         # bonus validation loop cap

paths:
  output_dir: output
  prompts_dir: prompts
